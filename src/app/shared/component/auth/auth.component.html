<div class="main">
    <ng-container *ngIf="allreadyhaveaccount">
                  <div class="card">
            <div class="card-body">
                <h2>logIn</h2>
                <form [formGroup]="loginform" (ngSubmit)="onloginform()">
                    <div class="form-group">
                        <label for="email">email</label>
                        <input type="text" class="form-control" formControlName="email">
                    </div>

                      <div class="form-group">
                        <label for="password">password</label>
                        <input type="text" class="form-control" formControlName="password">
                    </div>

                  
                    <button mat-raised-button color="primary" class="w-100">LogIn</button>
                        <p (click)="allreadyhaveaccount=false">
                     <a href="javascript:;">Dont have Account</a>
                    </p>
                </form>
            </div>
           </div>
    </ng-container>

      <ng-container *ngIf="!allreadyhaveaccount">
           
           <div class="card">
            <div class="card-body">
                <h2>signup</h2>
                <form [formGroup]="signupform" (ngSubmit)="onsinupform()">
                    <div class="form-group">
                        <label for="email">email</label>
                        <input type="text" class="form-control" formControlName="email">
                    </div>

                      <div class="form-group">
                        <label for="password">password</label>
                        <input type="text" class="form-control" formControlName="password">
                    </div>

                      <div class="form-group">
                        <label for="userRole">userRole</label>
                        <select type="text" class="form-control" formControlName="userRole">
                            <option value="admin">admin</option>
                            <option value="buyer">buyer</option>
                            <option value="superAdmin">superAdmin</option>

                        </select>
                    </div>
                  
                    <button mat-raised-button color="primary" class="w-100">Signup</button>
                          <p (click)="allreadyhaveaccount=true">
                     <a href="javascript:;">AllReady have Account</a>
                    </p>

                </form>
            </div>
           </div>
    </ng-container>
</div>
