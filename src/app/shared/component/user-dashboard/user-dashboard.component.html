<div class="row">
    <div class="col-12 text-right">
        <button mat-raised-button routerLink="adduser" color="accent">
            
            add user
        </button>
       
    </div>
     <div class="col-md-4">
               <ul class="list-group">
                <li class="list-group-item"
                *ngFor="let user of userArr"
                routerLinkActive="active"
                [routerLink]="['/user',user.userId]"
                [queryParams]="{'cr':user.userRole}"
              
                >
                {{user.userName}}
                <strong
                class="badge"
                [ngClass]="
                {
                    'badge-success':user.isActive,
                    'badge-danger':!user.isActive

                }"
                >
                    {{user.isActive ?'Active' :'In-active'}}
                </strong>

                </li>
               </ul>
        </div>
        <div class="col-md-8">
            <router-outlet></router-outlet>
        </div>
</div>
